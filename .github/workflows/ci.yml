name: Artixain Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-domain-and-web:
    name: Domain Math & Web Storefront Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Shared Domain Package (@artixain/shared)
        run: npm --workspace=@artixain/shared run build

      - name: Execute Domain Invariant Mathematical Test Runner
        run: node test/verify_pure.mjs

      - name: Build Next.js 15 Web Application (@artixain/web)
        run: npm --workspace=@artixain/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/artixain_test' }}

      - name: Absolute Zero-Emoji Static AST Audit
        run: |
          echo "[INFO] Running Zero-Emoji AST Audit across workspace..."
          # Verify no decorative emojis exist in source code
          grep -rnP '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]' apps/ packages/ || echo "[PASS] Absolute Zero-Emoji Law Verified."

  validate-flutter-mobile:
    name: Flutter 3 Cross-Platform Mobile Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3 SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: apps/mobile
        run: flutter analyze

      - name: Execute Flutter Unit & Invariant Test Suite
        working-directory: apps/mobile
        run: flutter test --coverage
